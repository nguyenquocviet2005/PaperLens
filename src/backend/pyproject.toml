[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperlens"
version = "0.1.0"
description = "Multimodal research-paper ingestion and understanding MVP"
readme = {text = "PaperLens backend service", content-type = "text/markdown"}
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "docling>=2.115",
  "boto3>=1.34",
  "pandas>=2.2",
  "pillow>=10.4",
  "openai>=1.40",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.13",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "langgraph>=0.2",
  "langchain",
  "langchain-core>=0.3",
  "langchain-openai",
  "langchain-postgres",
  "langchain-text-splitters",
  "langchain-community",
  "langchain-classic",
  "tiktoken>=0.7",
  "rank-bm25",
  "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "moto[s3]>=5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: optional end-to-end tests requiring local sample PDF / Docling",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
